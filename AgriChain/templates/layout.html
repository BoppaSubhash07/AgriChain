<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} | AgriChain RBK Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">AC</span>
        <span>
          AgriChain
          <span class="brand-sub">RBK Digital Agriculture &amp; Traceability</span>
        </span>
      </a>
      <div class="topbar-right">
        {{ topbar_actions }}
      </div>
    </div>
  </header>

  <div id="portal-flash-region">{{ flash_html }}</div>
  {{ content }}

  <!-- Live Toast Stack -->
  <div id="portal-toast-stack" class="toast-stack" role="status" aria-live="polite"></div>

  <!-- Dynamic QR Agronomic Passport Drawer -->
  <div id="passport-drawer" class="drawer-backdrop hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="passport-drawer-title">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <div class="kpi-label">Batch Traceability Audit</div>
          <h2 id="passport-drawer-title" class="card-title">Agronomic QR Passport</h2>
        </div>
        <div class="btn-group-inline">
          <button type="button" class="btn btn-outline btn-sm no-print" onclick="window.print()">Print Audit</button>
          <button type="button" class="btn btn-outline btn-sm" id="passport-drawer-close" aria-label="Close passport drawer">Close</button>
        </div>
      </div>
      <div id="passport-drawer-body" class="drawer-body">
        <p class="text-muted">Loading agronomic passport...</p>
      </div>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
  <script src="/static/js/qr.js"></script>
  <script src="/static/js/portal.js"></script>
</body>
</html>
