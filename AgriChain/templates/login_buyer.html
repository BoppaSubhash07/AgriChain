<main class="auth-shell">
  <div class="auth-card wide">
    <div class="auth-top">
      <a href="/" class="auth-back">&larr; Switch Role</a>
      <span class="badge badge-blue">Institutional Buyer Portal</span>
    </div>
    <h1 class="auth-title">Buyer Sign In &amp; Onboarding</h1>
    <p class="auth-sub">Sign in with your Buyer ID or Organization Email, or register as an accredited buyer.</p>

    {{ error_html }}

    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" data-buyer-mode="login">Organization Sign In</button>
      <button type="button" class="auth-tab" data-buyer-mode="register">Register New Buyer</button>
    </div>

    <!-- Sign In Panel -->
    <div id="buyer-login-panel">
      <form method="POST" action="/login/buyer" autocomplete="off">
        <div class="form-group">
          <label for="buyer_identifier">Buyer ID / Organization Email</label>
          <input type="text" id="buyer_identifier" name="identifier" required
                 placeholder="e.g. BUY-001 or procure@itcagri.com"
                 value="{{ prev_identifier }}">
        </div>

        <div class="form-group">
          <label for="buyer_password">Password</label>
          <div class="password-wrap">
            <input type="password" id="buyer_password" name="password" required
                   placeholder="Enter organization password">
            <button type="button" class="eye-toggle-btn" data-eye-toggle="buyer_password" aria-label="Show password">
              <svg class="eye-svg" viewBox="0 0 32 24" aria-hidden="true">
                <path class="eye-outline" d="M2 12 C7 4, 25 4, 30 12 C25 20, 7 20, 2 12 Z"/>
                <circle class="eye-iris" cx="16" cy="12" r="5"/>
                <circle class="eye-pupil" cx="16" cy="12" r="2.4"/>
                <path class="eye-lid-upper" d="M2 12 C7 19, 25 19, 30 12"/>
                <g class="eye-lashes">
                  <line x1="9" y1="16.5" x2="7.5" y2="19.5"/>
                  <line x1="16" y1="17.5" x2="16" y2="20.8"/>
                  <line x1="23" y1="16.5" x2="24.5" y2="19.5"/>
                </g>
                <line class="eye-slash" x1="5" y1="20" x2="27" y2="4"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-blue btn-block">Sign In to Buyer Home &rarr;</button>
      </form>

      <div class="demo-box">
        <div class="demo-box-title">Quick-Fill Accredited Buyers (Password: <code class="mono">buyer@123</code>)</div>
        <button type="button" class="demo-chip"
                data-fill-target="buyer_identifier=procure@itcagri.com|buyer_password=buyer@123">
          ITC Agri Business (BUY-001)
        </button>
        <button type="button" class="demo-chip"
                data-fill-target="buyer_identifier=sourcing@bigbasket.com|buyer_password=buyer@123">
          BigBasket Fresh (BUY-002)
        </button>
        <button type="button" class="demo-chip"
                data-fill-target="buyer_identifier=spices.ap@allanasons.com|buyer_password=buyer@123">
          Allanasons Export (BUY-011)
        </button>
      </div>
    </div>

    <!-- Buyer Onboarding Registration Panel -->
    <div id="buyer-register-panel" class="hidden">
      <form method="POST" action="/buyer/register">
        <div class="form-row">
          <div class="form-group">
            <label for="reg_buyer_name">Organization Name *</label>
            <input type="text" id="reg_buyer_name" name="buyer_name" required placeholder="e.g. Cargill Foods AP">
          </div>
          <div class="form-group">
            <label for="reg_buyer_type">Buyer Classification *</label>
            <select id="reg_buyer_type" name="buyer_type" required>
              <option value="Exporter">Exporter (EU/US Residue Audited)</option>
              <option value="Processor">Food Processor / Miller</option>
              <option value="Retailer">Modern Retailer</option>
              <option value="Wholesaler">Wholesaler / Commodity Desk</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg_buyer_email">Organization Email *</label>
            <input type="email" id="reg_buyer_email" name="email" required placeholder="procure@company.com">
          </div>
          <div class="form-group">
            <label for="reg_buyer_phone">Contact Phone *</label>
            <input type="tel" id="reg_buyer_phone" name="phone" required placeholder="9848XXXXXX">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg_buyer_gst">GST / Agricultural Board Reg. No. *</label>
            <input type="text" id="reg_buyer_gst" name="registration_number" required placeholder="GSTIN37...">
          </div>
          <div class="form-group">
            <label for="reg_buyer_pwd">Portal Password *</label>
            <div class="password-wrap">
              <input type="password" id="reg_buyer_pwd" name="password" required placeholder="Create password">
              <button type="button" class="eye-toggle-btn" data-eye-toggle="reg_buyer_pwd" aria-label="Show password">
                <svg class="eye-svg" viewBox="0 0 32 24" aria-hidden="true">
                  <path class="eye-outline" d="M2 12 C7 4, 25 4, 30 12 C25 20, 7 20, 2 12 Z"/>
                  <circle class="eye-iris" cx="16" cy="12" r="5"/>
                  <circle class="eye-pupil" cx="16" cy="12" r="2.4"/>
                  <path class="eye-lid-upper" d="M2 12 C7 19, 25 19, 30 12"/>
                  <g class="eye-lashes">
                    <line x1="9" y1="16.5" x2="7.5" y2="19.5"/>
                    <line x1="16" y1="17.5" x2="16" y2="20.8"/>
                    <line x1="23" y1="16.5" x2="24.5" y2="19.5"/>
                  </g>
                  <line class="eye-slash" x1="5" y1="20" x2="27" y2="4"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="reg_buyer_addr">Processing Plant / Hub Address</label>
          <input type="text" id="reg_buyer_addr" name="address" placeholder="Industrial Estate / Port Road">
        </div>
        <button type="submit" class="btn btn-blue btn-block">Register &amp; Onboard Buyer Organization</button>
      </form>
    </div>
  </div>
</main>
